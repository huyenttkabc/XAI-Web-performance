<text x="48" y="667" font-size="13" fill="#222222">A  Observational arm (associational)</text>
<rect x="362" y="654" width="16" height="16" rx="3" fill="#FDF3E1" stroke="#E69F00" stroke-width="1.6"/>
<text x="386" y="667" font-size="13" fill="#222222">B  Controlled arm (causal, known cause)</text>
<rect x="722.5" y="654" width="16" height="16" rx="3" fill="#E3F4EE" stroke="#009E73" stroke-width="1.6"/>
<text x="746.5" y="667" font-size="13" fill="#222222">C  Case study (intervention)</text>
<rect x="1000.5" y="654" width="16" height="16" rx="3" fill="#F4F4F4" stroke="#B5B5B5" stroke-width="1.6"/>
<text x="1024.5" y="667" font-size="13" fill="#222222">Shared stages, one protocol</text>
